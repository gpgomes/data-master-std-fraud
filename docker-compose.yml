# ── Rede compartilhada ─────────────────────────────────────────────────────────
networks:
  data-master-network:
    driver: bridge

# ── Volumes persistentes ───────────────────────────────────────────────────────
volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  minio-data:
  postgres-airflow-data:
  postgres-serving-data:
  superset-data:

services:

  # ── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      TZ: America/Sao_Paulo
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Kafka broker ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      TZ: America/Sao_Paulo
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Init — cria tópicos ─────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Criando tópicos Kafka ==="
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic raw-transactions --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic raw-market-data --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic enriched-transactions --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic fraud-alerts --partitions 1 --replication-factor 1
        echo "=== Tópicos criados ==="
        kafka-topics --bootstrap-server kafka:9092 --list
    networks:
      - data-master-network
    restart: on-failure

  # ── Kafka UI ──────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - data-master-network

  # ── MinIO ─────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: America/Sao_Paulo
    ports:
      - "${MINIO_EXTERNAL_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO Init — cria buckets ─────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        for bucket in bronze silver gold checkpoints; do
          mc mb --ignore-existing "local/$${bucket}"
          echo "Bucket $${bucket} pronto."
        done
        mc anonymous set download local/bronze || true
        echo "=== MinIO inicializado ==="
    networks:
      - data-master-network
    restart: on-failure

  # ── Spark Master ──────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./docker/spark
      dockerfile: Dockerfile
    image: data-master-spark:latest
    pull_policy: build
    container_name: spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: America/Sao_Paulo
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Spark Worker 1 ────────────────────────────────────────────────────────────
  spark-worker-1:
    image: data-master-spark:latest
    pull_policy: never
    container_name: spark-worker-1
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2G", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: America/Sao_Paulo
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
    networks:
      - data-master-network

  # ── Spark Worker 2 ────────────────────────────────────────────────────────────
  spark-worker-2:
    image: data-master-spark:latest
    pull_policy: never
    container_name: spark-worker-2
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "2", "--memory", "2G", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TZ: America/Sao_Paulo
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
    networks:
      - data-master-network

  # ── PostgreSQL — metadata do Airflow ──────────────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      TZ: America/Sao_Paulo
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL — serving layer (fraud_analytics) ───────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: datamaster
      POSTGRES_PASSWORD: datamaster123
      POSTGRES_DB: fraud_analytics
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres-serving-data:/var/lib/postgresql/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamaster -d fraud_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Airflow Init ──────────────────────────────────────────────────────────────
  airflow-init:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: data-master-airflow:latest
    pull_policy: build
    container_name: airflow-init
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd4e0="
      AIRFLOW__WEBSERVER__SECRET_KEY: "data-master-local-secret-key-2024"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      TZ: America/Sao_Paulo
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@datamaster.local \
          --password admin 2>/dev/null || true
        echo "=== Airflow inicializado ==="
    networks:
      - data-master-network
    restart: on-failure

  # ── Airflow Webserver ─────────────────────────────────────────────────────────
  airflow-webserver:
    image: data-master-airflow:latest
    pull_policy: never
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd4e0="
      AIRFLOW__WEBSERVER__SECRET_KEY: "data-master-local-secret-key-2024"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_USER: datamaster
      POSTGRES_PASSWORD: datamaster123
      POSTGRES_DB: fraud_analytics
      TZ: America/Sao_Paulo
    ports:
      - "8082:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Airflow Scheduler ─────────────────────────────────────────────────────────
  airflow-scheduler:
    image: data-master-airflow:latest
    pull_policy: never
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfd4e0="
      AIRFLOW__WEBSERVER__SECRET_KEY: "data-master-local-secret-key-2024"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      POSTGRES_HOST: postgres
      POSTGRES_USER: datamaster
      POSTGRES_PASSWORD: datamaster123
      POSTGRES_DB: fraud_analytics
      TZ: America/Sao_Paulo
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
    networks:
      - data-master-network
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Apache Superset ───────────────────────────────────────────────────────────
  superset:
    image: apache/superset:3.1.0
    container_name: superset
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "superset-secret-key-local-dev-only"
      DATABASE_DIALECT: postgresql
      DATABASE_USER: datamaster
      DATABASE_PASSWORD: datamaster123
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_DB: fraud_analytics
      SUPERSET_LOAD_EXAMPLES: "no"
      TZ: America/Sao_Paulo
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/superset_home
    networks:
      - data-master-network
    command: >
      bash -c "
        pip install psycopg2-binary --quiet &&
        superset db upgrade &&
        superset fab create-admin
          --username admin
          --firstname Admin
          --lastname User
          --email admin@superset.local
          --password admin 2>/dev/null || true &&
        superset init &&
        gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 --keep-alive 5
          --log-level info 'superset.app:create_app()'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Producer — Transações ─────────────────────────────────────────────────────
  producer-transactions:
    build:
      context: ./docker/producer
    image: data-master-producer:latest
    pull_policy: build
    container_name: producer-transactions
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      PRODUCER_TYPE: transactions
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCER_RATE_TPS: "10"
      GENERATOR_SEED: "0"
      SOURCE_SYSTEM: transaction-simulator
      LOG_LEVEL: INFO
      TZ: America/Sao_Paulo
    volumes:
      - ./src:/app/src
    networks:
      - data-master-network
    profiles:
      - producers

  # ── Producer — Dados de Mercado ───────────────────────────────────────────────
  producer-market:
    build:
      context: ./docker/producer
    image: data-master-producer:latest
    pull_policy: build
    container_name: producer-market
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      producer-transactions:
        condition: service_started
    environment:
      PRODUCER_TYPE: market
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKET_PRODUCER_RATE_TPS: "50"
      SOURCE_SYSTEM: market-simulator
      LOG_LEVEL: INFO
      TZ: America/Sao_Paulo
    volumes:
      - ./src:/app/src
    networks:
      - data-master-network
    profiles:
      - producers
