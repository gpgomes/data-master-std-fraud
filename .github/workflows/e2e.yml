name: E2E

# Teste ponta a ponta (issue #57): sobe a stack mínima (Kafka, MinIO, Postgres e o container do
# Spark, sem workers, Airflow nem Superset), roda o batch e o stream de verdade num namespace isolado
# (e2e-*) e verifica as invariantes de dados e os cenários de falha. Manual e noturno: é pesado
# demais para cada PR, que continua com o `ci.yml` (lint + unitários).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 03h em Brasília

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (batch + stream + falhas)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Configure environment
        # `make env` gera os segredos que o docker-compose.yml exige (issue #58).
        # `data/` é montado no container do Spark: se o Docker o criar ao subir a stack, a pasta fica
        # do root e o pytest (usuário do runner) não consegue gravar data/e2e.
        run: |
          make env PYTHON=python
          mkdir -p data/e2e

      - name: Start minimal stack
        run: docker compose up -d --build zookeeper kafka minio postgres spark-master

      - name: Wait for healthy services
        run: |
          for service in kafka minio postgres spark-master; do
            for i in $(seq 1 60); do
              status=$(docker compose ps "$service" --format '{{.Status}}')
              if echo "$status" | grep -q "(healthy)"; then echo "$service: $status"; break; fi
              if [ "$i" = 60 ]; then echo "$service não ficou healthy: $status"; docker compose logs "$service" | tail -50; exit 1; fi
              sleep 5
            done
          done

      - name: Run E2E
        run: make e2e PYTHON=python

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            data/e2e/report.json
            data/e2e/junit.xml
          if-no-files-found: ignore

      - name: Container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail 200 kafka minio postgres spark-master
          docker compose exec -T spark-master sh -c 'tail -200 /tmp/e2e_stream.log' || true

      - name: Tear down
        if: always()
        run: docker compose down -v
