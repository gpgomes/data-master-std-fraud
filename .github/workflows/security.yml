name: Security

# Scans de segurança (issue #58). Todo gate bloqueia; o que não dá para corrigir agora entra em
# `security/exceptions.toml` com motivo e data de revisão (o job `exceptions` falha quando vence).
#   - gitleaks: segredos em todo o histórico do git
#   - pip-audit: CVEs nas dependências do pyproject.toml
#   - trivy: CVEs HIGH/CRITICAL com correção nas quatro imagens (API, producers, Airflow, Spark)
# Nas imagens do Airflow e do Spark o gate não olha os .jar (`--skip-files '**/*.jar'`): são as libs
# Java da distribuição do Spark 4.2.0 / Hadoop 3.5.0 e do AWS SDK v2: nem o Spark mais novo vem sem
# elas (issue #69), e a correção depende de novas versões da distribuição. Eles continuam no
# relatório não bloqueante (job base-images-report).
# Semanal além de push/PR: CVE novo aparece sem mudança de código.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1" # segunda, 04h em Brasília

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.74.0

jobs:
  exceptions:
    name: Exceptions (motivo + revisão em dia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check security/exceptions.toml
        run: python -m scripts.security_exceptions check

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o histórico inteiro, não só o último commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate .gitleaksignore
        run: python -m scripts.security_exceptions gitleaksignore
      - name: Scan git history
        run: >
          docker run --rm -v "$PWD":/repo "$GITLEAKS_IMAGE"
          git /repo --redact --no-banner --exit-code 1

  pip-audit:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        # O Python do runner vem com pip/setuptools próprios (fora do pyproject.toml) e o pip-audit
        # audita o ambiente inteiro: atualizá-los evita CVE da ferramenta de build (setuptools 79
        # tinha PYSEC-2026-3447), sem virar exceção.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]" pip-audit
      - name: Audit
        run: pip-audit --skip-editable $(python -m scripts.security_exceptions pip-audit-args)

  trivy:
    name: Image (trivy) — ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
          - image: producer
            context: docker/producer
          - image: airflow
            context: docker/airflow
            extra: --skip-files '**/*.jar'
          - image: spark
            context: docker/spark
            extra: --skip-files '**/*.jar'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate .trivyignore
        run: python -m scripts.security_exceptions trivyignore
      - name: Build
        run: docker build -t "scan/${{ matrix.image }}" -f "docker/${{ matrix.image }}/Dockerfile" "${{ matrix.context }}"
      - name: Scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/repo -w /repo
          "$TRIVY_IMAGE" image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /repo/.trivyignore ${{ matrix.extra }} "scan/${{ matrix.image }}"

  base-images-report:
    # Varredura completa, com os .jar, só para acompanhar a #69: não bloqueia.
    name: Report (trivy, fora do gate) — ${{ matrix.image }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [airflow, spark]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "scan/${{ matrix.image }}" -f "docker/${{ matrix.image }}/Dockerfile" "docker/${{ matrix.image }}"
      - name: Scan (sem bloquear)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            --format table --output "/out/trivy-${{ matrix.image }}.txt" "scan/${{ matrix.image }}"
          tail -5 "trivy-${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
