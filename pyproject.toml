[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-master-std-fraud"
version = "0.1.0"
description = "Financial Fraud Detection Platform — Data Master Case"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Gomes", email = "gpgomes@example.com" }]

dependencies = [
    # Spark
    "pyspark==3.5.1",
    # Kafka
    "kafka-python-ng>=2.2.2",
    "confluent-kafka==2.3.0",
    "fastavro==1.9.4",
    "lz4>=4.0.0",
    # Data collection
    "yfinance==0.2.36",
    "requests==2.31.0",
    "tenacity==8.2.3",
    # Data manipulation
    "pandas==2.2.1",
    "pyarrow==15.0.0",
    "numpy==1.26.4",
    # Data generation
    "faker==24.0.0",
    # Data quality
    "great-expectations==0.18.13",
    # API
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    # Storage
    "boto3==1.34.74",
    "s3fs==2024.3.1",
    # Database
    "psycopg2-binary==2.9.9",
    "sqlalchemy==2.0.29",
    # Logging
    "loguru==0.7.2",
    # Utilities
    "python-dotenv==1.0.1",
    "click==8.1.7",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "pytest-mock==3.14.0",
    "black==24.3.0",
    "ruff==0.3.5",
    "mypy==1.9.0",
    "types-requests==2.31.0.20240311",
    "httpx==0.27.0",
    # Parser HCL dos guardrails do Terraform (tests/unit/test_terraform_guardrails.py)
    "python-hcl2==8.1.4",
]

[project.scripts]
generate-data = "scripts.generate_sample_data:main"
seed-openmetadata = "scripts.seed_openmetadata:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# schemas.py precisa continuar importável no Python 3.8 do container Spark
# (issue #11) — StrEnum tem shim condicional e os campos opcionais usam
# `Optional[X]` (não `X | None`, que quebra a resolução de tipos do Pydantic
# em runtimes < 3.10) de propósito, não por desatualização.
"src/common/schemas.py" = ["UP036", "UP007"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
    "-v",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
