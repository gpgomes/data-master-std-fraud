<g data-key="bronze_transactions"><title>Bronze — Transações: Transações financeiras raw, conforme recebidas do Kafka.</title><rect x="118" y="142" width="216" height="48" rx="8" fill="#F6E6D6" stroke="#B0703C" stroke-width="1.6"/><text x="126" y="154" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B0703C">BRONZE</text><text x="226" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="226" dy="0">Transações</tspan></text></g><g data-key="bronze_market_data"><title>Bronze — Market Data: Cotações OHLCV coletadas via yfinance.</title><rect x="118" y="373.2" width="216" height="48" rx="8" fill="#F6E6D6" stroke="#B0703C" stroke-width="1.6" stroke-dasharray="6 4"/><text x="126" y="385.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B0703C">BRONZE</text><text x="326" y="385.2" text-anchor="end" font-size="9" fill="#5B6673">opcional</text><text x="226" y="406.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="226" dy="0">Market Data</tspan></text></g><g data-key="silver_transactions"><title>Silver — Transações: Transações limpas, deduplicadas, timestamps normalizados para UTC.</title><rect x="394" y="142" width="216" height="48" rx="8" fill="#E8EBF0" stroke="#6F7C8B" stroke-width="1.6"/><text x="402" y="154" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6F7C8B">SILVER</text><text x="502" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="502" dy="0">Transações</tspan></text></g><g data-key="silver_market_data"><title>Silver — Market Data: Cotações enriquecidas com retorno diário e price range.</title><rect x="394" y="373.2" width="216" height="48" rx="8" fill="#E8EBF0" stroke="#6F7C8B" stroke-width="1.6" stroke-dasharray="6 4"/><text x="402" y="385.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6F7C8B">SILVER</text><text x="602" y="385.2" text-anchor="end" font-size="9" fill="#5B6673">opcional</text><text x="502" y="406.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="502" dy="0">Market Data</tspan></text></g><g data-key="silver_transactions_stream"><title>Silver — Transações (Streaming): Saída do detector de streaming (issue #11), particionada por query_id/batch_id: transações com z_score, fraud_score e is_anomaly. Só existe depois que o job de streaming rodou.</title><rect x="394" y="495.2" width="216" height="48" rx="8" fill="#E8EBF0" stroke="#6F7C8B" stroke-width="1.6" stroke-dasharray="6 4"/><text x="402" y="507.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6F7C8B">SILVER</text><text x="602" y="507.2" text-anchor="end" font-size="9" fill="#5B6673">opcional</text><text x="502" y="528.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="502" dy="0">Transações (Streaming)</tspan></text></g><g data-key="gold_fact_transactions"><title>Gold — Fato Transações: Tabela fato de transações — grão: uma linha por transação.</title><rect x="670" y="74" width="216" height="48" rx="8" fill="#FBF1CC" stroke="#B8901F" stroke-width="1.6"/><text x="678" y="86" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B8901F">GOLD</text><text x="778" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="778" dy="0">Fato Transações</tspan></text></g><g data-key="gold_dim_customers"><title>Gold — Dimensão Clientes: Dimensão de clientes (SCD2, apenas registro corrente).</title><rect x="670" y="210" width="216" height="48" rx="8" fill="#FBF1CC" stroke="#B8901F" stroke-width="1.6"/><text x="678" y="222" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B8901F">GOLD</text><text x="778" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="778" dy="0">Dimensão Clientes</tspan></text></g><g data-key="gold_dim_date"><title>Gold — Dimensão Data: Dimensão de calendário derivada das datas distintas do Silver.</title><rect x="670" y="278" width="216" height="48" rx="8" fill="#FBF1CC" stroke="#B8901F" stroke-width="1.6"/><text x="678" y="290" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B8901F">GOLD</text><text x="778" y="311" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="778" dy="0">Dimensão Data</tspan></text></g><g data-key="gold_agg_daily_fraud_metrics"><title>Gold — Métricas Diárias de Fraude: Agregação diária de volume e taxa de fraude por tipo de transação.</title><rect x="670" y="142" width="216" height="48" rx="8" fill="#FBF1CC" stroke="#B8901F" stroke-width="1.6"/><text x="678" y="154" font-size="9" font-weight="700" letter-spacing="0.6" fill="#B8901F">GOLD</text><text x="778" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="778" dy="0">Métricas Diárias de Fraude</tspan></text></g><g data-key="serving_fact_transactions"><title>Postgres — fact_transactions: Espelho da tabela fato Gold, carregado via truncate+reload (issue #10).</title><rect x="946" y="74" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="86" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">fact_transactions</tspan></text></g><g data-key="serving_dim_customers"><title>Postgres — dim_customers: Espelho da dimensão de clientes Gold.</title><rect x="946" y="210" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="222" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="243" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">dim_customers</tspan></text></g><g data-key="serving_dim_date"><title>Postgres — dim_date: Espelho da dimensão de calendário Gold.</title><rect x="946" y="278" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="290" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="311" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">dim_date</tspan></text></g><g data-key="serving_agg_daily_fraud_metrics"><title>Postgres — agg_daily_fraud_metrics: Espelho da agregação diária de fraude Gold, consumido pela API (issue #15).</title><rect x="946" y="142" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="154" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">agg_daily_fraud_metrics</tspan></text></g><g data-key="serving_stream_scored_transactions"><title>Postgres — stream_scored_transactions: Transações pontuadas pelo detector de streaming (fraud_score, z_score, latência evento→processamento), carregadas por `make spark-submit-stream-postgres` (issue #38).</title><rect x="946" y="495.2" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="507.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="528.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">stream_scored_transactions</tspan></text></g><g data-key="serving_fraud_alerts"><title>Postgres — fraud_alerts: Alertas do detector de streaming, os mesmos do tópico fraud-alerts; consumido por GET /alerts (issue #38).</title><rect x="946" y="563.2" width="216" height="48" rx="8" fill="#DDEBFA" stroke="#2F78BD" stroke-width="1.6"/><text x="954" y="575.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2F78BD">SERVING</text><text x="1054" y="596.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1054" dy="0">fraud_alerts</tspan></text></g><g data-key="kafka_raw_transactions"><title>Kafka — raw-transactions: Transações publicadas em tempo real pelo producer.</title><rect x="118" y="529.2" width="216" height="48" rx="8" fill="#E6E2F8" stroke="#6250C2" stroke-width="1.6"/><text x="126" y="541.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6250C2">KAFKA</text><text x="226" y="562.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="226" dy="0">raw-transactions</tspan></text></g><g data-key="kafka_raw_market_data"><title>Kafka — raw-market-data: Cotações publicadas em tempo real pelo producer. Sem consumidor na V1: o Spark Streaming só lê raw-transactions e o Bronze de mercado vem do yfinance.</title><rect x="118" y="699.2" width="216" height="48" rx="8" fill="#E6E2F8" stroke="#6250C2" stroke-width="1.6"/><text x="126" y="711.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6250C2">KAFKA</text><text x="226" y="732.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="226" dy="0">raw-market-data</tspan></text><text x="226" y="761.2" text-anchor="middle" font-size="10" font-style="italic" fill="#5B6673">sem consumidor no catálogo</text></g><g data-key="kafka_enriched_transactions"><title>Kafka — enriched-transactions: Transações com fraud_score anexado pelo StreamProcessor (issue #11).</title><rect x="394" y="563.2" width="216" height="48" rx="8" fill="#E6E2F8" stroke="#6250C2" stroke-width="1.6"/><text x="402" y="575.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6250C2">KAFKA</text><text x="502" y="596.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="502" dy="0">enriched-transactions</tspan></text></g><g data-key="kafka_fraud_alerts"><title>Kafka — fraud-alerts: Alertas de fraude confirmados pelo detector Z-Score (issue #11).</title><rect x="670" y="631.2" width="216" height="48" rx="8" fill="#E6E2F8" stroke="#6250C2" stroke-width="1.6"/><text x="678" y="643.2" font-size="9" font-weight="700" letter-spacing="0.6" fill="#6250C2">KAFKA</text><text x="778" y="664.2" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="778" dy="0">fraud-alerts</tspan></text></g><g data-key="dashboard_fraud_overview"><title>Dashboard — Visão Geral de Fraude: KPIs de volume, valor, taxa de fraude e alertas, mais latência, distribuição de fraud_score e alertas por hora do streaming (Superset — Grafana descoped, issue #16).</title><rect x="1222" y="318.6" width="216" height="48" rx="8" fill="#DDF3E4" stroke="#2A9455" stroke-width="1.6"/><text x="1230" y="330.6" font-size="9" font-weight="700" letter-spacing="0.6" fill="#2A9455">DASHBOARD</text><text x="1330" y="351.6" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2933"><tspan x="1330" dy="0">Visão Geral de Fraude</tspan></text></g>
