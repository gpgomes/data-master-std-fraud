<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="870" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Data Master — Arquitetura V1 (Local)</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#64748b">Medallion Architecture (Bronze → Silver → Gold) · arquitetura Lambda — batch e streaming processam em paralelo</text>

  <!-- ============ BAND 1 — Fontes de Dados ============ -->
  <rect x="40" y="82" width="8" height="8" rx="2" fill="#64748b"/>
  <text x="54" y="90" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">FONTES DE DADOS</text>

  <g>
    <rect x="40" y="100" width="360" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="220" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Yahoo Finance</text>
    <text x="220" y="157" text-anchor="middle" font-size="11.5" fill="#64748b">yfinance</text>

    <rect x="420" y="100" width="360" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="600" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Simulador Python</text>
    <text x="600" y="157" text-anchor="middle" font-size="11.5" fill="#64748b">Transações PIX / TED / DOC</text>

    <rect x="800" y="100" width="360" height="88" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="980" y="139" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Datasets CSV</text>
    <text x="980" y="157" text-anchor="middle" font-size="11.5" fill="#64748b">Cargas históricas</text>
  </g>

  <line x1="600" y1="188" x2="600" y2="206" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BAND 2 — Ingestão ============ -->
  <rect x="40" y="212" width="8" height="8" rx="2" fill="#4f46e5"/>
  <text x="54" y="220" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">CAMADA DE INGESTÃO</text>

  <g>
    <rect x="40" y="230" width="550" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="315" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">Apache Kafka</text>
    <text x="315" y="284" text-anchor="middle" font-size="11.5" fill="#4338ca">raw-transactions · raw-market-data</text>

    <rect x="610" y="230" width="550" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="885" y="266" text-anchor="middle" font-size="15" font-weight="600" fill="#312e81">Python Batch Ingestion</text>
    <text x="885" y="284" text-anchor="middle" font-size="11.5" fill="#4338ca">Airflow DAGs</text>
  </g>

  <line x1="600" y1="310" x2="600" y2="328" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BAND 3 — Data Lake (Medallion) ============ -->
  <rect x="40" y="334" width="8" height="8" rx="2" fill="#a16207"/>
  <text x="54" y="342" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">DATA LAKE — MinIO (S3-compatible)</text>

  <g>
    <rect x="40" y="352" width="360" height="86" rx="10" fill="#fdf2e9" stroke="#b45309" stroke-width="1.5"/>
    <text x="220" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Bronze</text>
    <text x="220" y="408" text-anchor="middle" font-size="11.5" fill="#9a3412">Raw · JSON / CSV</text>

    <line x1="400" y1="395" x2="418" y2="395" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="420" y="352" width="360" height="86" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="600" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Silver</text>
    <text x="600" y="408" text-anchor="middle" font-size="11.5" fill="#475569">Limpo, deduplicado · Parquet</text>

    <line x1="780" y1="395" x2="798" y2="395" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="800" y="352" width="360" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="980" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Gold</text>
    <text x="980" y="408" text-anchor="middle" font-size="11.5" fill="#9a3412">Star Schema, KPIs · Parquet</text>
  </g>

  <line x1="600" y1="438" x2="600" y2="456" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BAND 4 — Transformação (PySpark) ============ -->
  <rect x="40" y="462" width="8" height="8" rx="2" fill="#7c3aed"/>
  <text x="54" y="470" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">CAMADA DE TRANSFORMAÇÃO (PySpark)</text>

  <g>
    <rect x="40" y="480" width="550" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="315" y="518" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">Batch (PySpark)</text>
    <text x="315" y="536" text-anchor="middle" font-size="11.5" fill="#5b21b6">Bronze → Silver → Gold</text>

    <rect x="610" y="480" width="550" height="86" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="885" y="518" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">Spark Structured Streaming</text>
    <text x="885" y="536" text-anchor="middle" font-size="11.5" fill="#5b21b6">stream_processor.py — Z-Score</text>
  </g>

  <line x1="600" y1="566" x2="600" y2="584" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BAND 5 — Governança ============ -->
  <rect x="40" y="590" width="8" height="8" rx="2" fill="#059669"/>
  <text x="54" y="598" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">CAMADA DE GOVERNANÇA</text>

  <g>
    <rect x="40" y="608" width="550" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="315" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">Great Expectations</text>
    <text x="315" y="658" text-anchor="middle" font-size="11.5" fill="#047857">Quality gates</text>

    <rect x="610" y="608" width="550" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="885" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#065f46">Catálogo de Dados</text>
    <text x="885" y="658" text-anchor="middle" font-size="11.5" fill="#047857">Registro leve, versionado</text>
  </g>

  <line x1="600" y1="680" x2="600" y2="698" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ BAND 6 — Disponibilização ============ -->
  <rect x="40" y="704" width="8" height="8" rx="2" fill="#2563eb"/>
  <text x="54" y="712" font-size="12" font-weight="700" letter-spacing="0.06em" fill="#334155">CAMADA DE DISPONIBILIZAÇÃO</text>

  <g>
    <rect x="40" y="722" width="360" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="220" y="764" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">PostgreSQL</text>
    <text x="220" y="782" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Serving layer</text>

    <rect x="420" y="722" width="360" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="600" y="764" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">FastAPI</text>
    <text x="600" y="782" text-anchor="middle" font-size="11.5" fill="#1d4ed8">REST API</text>

    <rect x="800" y="722" width="360" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="980" y="764" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Apache Superset</text>
    <text x="980" y="782" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Dashboards</text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="838" x2="1160" y2="838" stroke="#e2e8f0" stroke-width="1"/>
  <text x="600" y="856" text-anchor="middle" font-size="11.5" fill="#64748b">Batch = fonte da verdade, reprocessável · Streaming = detecção em tempo real → Kafka (enriched-transactions, fraud-alerts) · V2/Cloud (Terraform/AWS): ver README</text>
</svg>
